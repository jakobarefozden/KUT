<!doctype html><html lang="no"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tastatur</title><style>body{font-family:Arial;max-width:700px;margin:40px auto;padding:20px}a,button,input{font-size:18px;margin:10px 8px 10px 0;padding:10px}:focus-visible{outline:4px solid #ff8800;outline-offset:4px}</style></head><body><h1>Test med tastaturet</h1><p>Trykk Tab for å flytte fokus. Trykk Enter på knappen, eller mellomrom når knappen har fokus.</p><a href="#resultat">Gå til resultat</a><label for="navn">Navn:</label><input id="navn" placeholder="Skriv navn"><button id="hei">Si hei</button><p id="resultat" aria-live="polite">Her kommer resultatet.</p><script>document.querySelector('#hei').addEventListener('click',function(){const navn=document.querySelector('#navn').value;document.querySelector('#resultat').textContent='Hei, '+(navn||'venn')+'!';});</script></body></html>
