<!doctype html>
<html lang="no">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Farger og kontrast</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Farger og kontrast</h1>
    <h2>Dårlig kontrast</h2>
    <p class="kort darlig">Denne teksten er vanskelig å lese.</p>
    <h2>God kontrast</h2>
    <p class="kort god">Denne teksten er lettere å lese.</p>
    <h2>Ikke bare farger</h2>
    <p><span class="feil">✕ Feil:</span> Passordet er for kort.</p>
    <p>Prøv å endre fargekodene i CSS og sammenlign.</p>
</body>

</html>
